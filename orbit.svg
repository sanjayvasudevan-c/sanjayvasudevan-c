<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Orbiting tech stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="core">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".9"/>
      <stop offset="70%" stop-color="#0e7490" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <filter id="og" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="oc"><rect width="1000" height="380" rx="16"/></clipPath>
  </defs>
  <style>
    .m{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:11px}
    .chip{fill:#060d18;stroke-width:1.2}
  </style>

  <g clip-path="url(#oc)">
    <rect width="1000" height="380" fill="#050a12"/>
    <g fill="#1e3a5f">
      <circle cx="90" cy="60" r="1.3"/><circle cx="210" cy="320" r="1"/><circle cx="880" cy="90" r="1.4"/>
      <circle cx="930" cy="300" r="1"/><circle cx="140" cy="200" r="1.1"/><circle cx="760" cy="340" r="1.2"/>
    </g>
    <text x="26" y="30" class="m" fill="#5eead4" letter-spacing="3.5">STACK IN ORBIT — HOVER-FREE, ALWAYS SPINNING</text>

    <g transform="translate(500,200)">
      <circle r="72" fill="url(#core)">
        <animate attributeName="r" values="66;78;66" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="30" fill="#061520" stroke="#22d3ee" stroke-width="1.6"/>
      <text class="m" y="-2" fill="#67e8f9" text-anchor="middle" font-size="10">SANJAY</text>
      <text class="m" y="11" fill="#5eead4" text-anchor="middle" font-size="8">CORE</text>

      <!-- ring guides -->
      <ellipse rx="140" ry="58" fill="none" stroke="#164e63" stroke-dasharray="3 7"/>
      <ellipse rx="250" ry="104" fill="none" stroke="#1e3a5f" stroke-dasharray="3 9"/>
      <ellipse rx="370" ry="150" fill="none" stroke="#1e293b" stroke-dasharray="3 11"/>

      <!-- INNER RING -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        <g transform="translate(140,0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/>
          <rect x="-30" y="-11" width="60" height="22" rx="11" class="chip" stroke="#fbbf24"/><text class="m" y="4" fill="#fbbf24" text-anchor="middle">PYTHON</text></g></g>
        <g transform="rotate(120) translate(140,0)"><g><animateTransform attributeName="transform" type="rotate" from="-120" to="-480" dur="18s" repeatCount="indefinite"/>
          <rect x="-26" y="-11" width="52" height="22" rx="11" class="chip" stroke="#60a5fa"/><text class="m" y="4" fill="#60a5fa" text-anchor="middle">DOCKER</text></g></g>
        <g transform="rotate(240) translate(140,0)"><g><animateTransform attributeName="transform" type="rotate" from="-240" to="-600" dur="18s" repeatCount="indefinite"/>
          <rect x="-18" y="-11" width="36" height="22" rx="11" class="chip" stroke="#a78bfa"/><text class="m" y="4" fill="#a78bfa" text-anchor="middle">K8S</text></g></g>
      </g>

      <!-- MIDDLE RING (reverse) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
        <g transform="translate(250,0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
          <rect x="-20" y="-11" width="40" height="22" rx="11" class="chip" stroke="#f97316"/><text class="m" y="4" fill="#f97316" text-anchor="middle">AWS</text></g></g>
        <g transform="rotate(90) translate(250,0)"><g><animateTransform attributeName="transform" type="rotate" from="-90" to="270" dur="26s" repeatCount="indefinite"/>
          <rect x="-33" y="-11" width="66" height="22" rx="11" class="chip" stroke="#a78bfa"/><text class="m" y="4" fill="#a78bfa" text-anchor="middle">TERRAFORM</text></g></g>
        <g transform="rotate(180) translate(250,0)"><g><animateTransform attributeName="transform" type="rotate" from="-180" to="180" dur="26s" repeatCount="indefinite"/>
          <rect x="-27" y="-11" width="54" height="22" rx="11" class="chip" stroke="#38bdf8"/><text class="m" y="4" fill="#38bdf8" text-anchor="middle">JENKINS</text></g></g>
        <g transform="rotate(270) translate(250,0)"><g><animateTransform attributeName="transform" type="rotate" from="-270" to="90" dur="26s" repeatCount="indefinite"/>
          <rect x="-28" y="-11" width="56" height="22" rx="11" class="chip" stroke="#fbbf24"/><text class="m" y="4" fill="#fbbf24" text-anchor="middle">GRAFANA</text></g></g>
      </g>

      <!-- OUTER RING -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
        <g transform="rotate(30) translate(370,0)"><g><animateTransform attributeName="transform" type="rotate" from="-30" to="-390" dur="38s" repeatCount="indefinite"/>
          <rect x="-21" y="-11" width="42" height="22" rx="11" class="chip" stroke="#22d3ee"/><text class="m" y="4" fill="#22d3ee" text-anchor="middle">REACT</text></g></g>
        <g transform="rotate(102) translate(370,0)"><g><animateTransform attributeName="transform" type="rotate" from="-102" to="-462" dur="38s" repeatCount="indefinite"/>
          <rect x="-33" y="-11" width="66" height="22" rx="11" class="chip" stroke="#4ade80"/><text class="m" y="4" fill="#4ade80" text-anchor="middle">POSTGRES</text></g></g>
        <g transform="rotate(174) translate(370,0)"><g><animateTransform attributeName="transform" type="rotate" from="-174" to="-534" dur="38s" repeatCount="indefinite"/>
          <rect x="-21" y="-11" width="42" height="22" rx="11" class="chip" stroke="#ef4444"/><text class="m" y="4" fill="#ef4444" text-anchor="middle">REDIS</text></g></g>
        <g transform="rotate(246) translate(370,0)"><g><animateTransform attributeName="transform" type="rotate" from="-246" to="-606" dur="38s" repeatCount="indefinite"/>
          <rect x="-26" y="-11" width="52" height="22" rx="11" class="chip" stroke="#4ade80"/><text class="m" y="4" fill="#4ade80" text-anchor="middle">MONGODB</text></g></g>
        <g transform="rotate(318) translate(370,0)"><g><animateTransform attributeName="transform" type="rotate" from="-318" to="-678" dur="38s" repeatCount="indefinite"/>
          <rect x="-20" y="-11" width="40" height="22" rx="11" class="chip" stroke="#facc15"/><text class="m" y="4" fill="#facc15" text-anchor="middle">LINUX</text></g></g>
      </g>

      <!-- signal pings from core -->
      <circle r="30" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0">
        <animate attributeName="r" values="30;250" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle r="30" fill="none" stroke="#a78bfa" stroke-width="1.2" opacity="0">
        <animate attributeName="r" values="30;250" dur="4s" begin="-2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="4s" begin="-2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
