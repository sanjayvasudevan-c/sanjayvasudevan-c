<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Animated CI/CD pipeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a12"/><stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
    <filter id="pg" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="wire" d="M110 110 H250 M330 110 H470 M550 110 H690 M770 110 H890" fill="none"/>
    <clipPath id="pc"><rect width="1000" height="220" rx="16"/></clipPath>
  </defs>
  <style>
    .m{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
    .stg{fill:#070e1a;stroke-width:1.4}
  </style>

  <g clip-path="url(#pc)">
    <rect width="1000" height="220" fill="url(#pbg)"/>
    <text x="26" y="30" class="m" font-size="12" fill="#38bdf8" letter-spacing="3.5">CONTINUOUS DELIVERY — ALWAYS GREEN</text>

    <!-- wires with flowing dashes -->
    <use href="#wire" stroke="#1b3c55" stroke-width="2"/>
    <use href="#wire" stroke="#22d3ee" stroke-width="2" stroke-dasharray="8 14" stroke-linecap="round" opacity=".9">
      <animate attributeName="stroke-dashoffset" values="44;0" dur="1.1s" repeatCount="indefinite"/>
    </use>

    <!-- commit packets travelling the whole line -->
    <g fill="#fbbf24">
      <rect x="-4" y="-4" width="8" height="8" rx="2" filter="url(#pg)">
        <animateMotion dur="5s" repeatCount="indefinite" calcMode="linear" path="M110 110 H890"/>
      </rect>
      <rect x="-3" y="-3" width="6" height="6" rx="2" fill="#4ade80">
        <animateMotion dur="5s" begin="-1.7s" repeatCount="indefinite" calcMode="linear" path="M110 110 H890"/>
      </rect>
      <rect x="-3" y="-3" width="6" height="6" rx="2" fill="#f472b6">
        <animateMotion dur="5s" begin="-3.4s" repeatCount="indefinite" calcMode="linear" path="M110 110 H890"/>
      </rect>
    </g>

    <!-- 1. GIT -->
    <g>
      <rect x="30" y="78" width="80" height="64" rx="10" class="stg" stroke="#f97316"/>
      <circle cx="58" cy="98" r="5" fill="none" stroke="#f97316" stroke-width="1.6"/>
      <circle cx="58" cy="122" r="5" fill="none" stroke="#f97316" stroke-width="1.6"/>
      <circle cx="84" cy="110" r="5" fill="none" stroke="#f97316" stroke-width="1.6"/>
      <path d="M58 103v14M62 99l18 8M62 121l18-8" stroke="#f97316" stroke-width="1.4" fill="none"/>
      <text x="70" y="162" class="m" font-size="10" fill="#f97316" text-anchor="middle">GIT PUSH</text>
      <rect x="30" y="78" width="80" height="64" rx="10" fill="#f97316" opacity="0">
        <animate attributeName="opacity" values="0;0.16;0" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- 2. JENKINS BUILD (gears) -->
    <g>
      <rect x="250" y="78" width="80" height="64" rx="10" class="stg" stroke="#38bdf8"/>
      <g transform="translate(282,104)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite" additive="sum"/>
        <circle r="9" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>
      </g>
      <g transform="translate(300,122)">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="2.2s" repeatCount="indefinite" additive="sum"/>
        <circle r="7" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="3 3"/>
      </g>
      <text x="290" y="162" class="m" font-size="10" fill="#38bdf8" text-anchor="middle">JENKINS</text>
      <rect x="250" y="78" width="80" height="64" rx="10" fill="#38bdf8" opacity="0">
        <animate attributeName="opacity" values="0;0.16;0" dur="5s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- 3. TEST (checks filling in) -->
    <g>
      <rect x="470" y="78" width="80" height="64" rx="10" class="stg" stroke="#4ade80"/>
      <g stroke="#4ade80" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M486 96l5 5 9-10" stroke-dasharray="22" stroke-dashoffset="22"><animate attributeName="stroke-dashoffset" values="22;0;0;22" keyTimes="0;0.2;0.9;1" dur="5s" repeatCount="indefinite"/></path>
        <path d="M486 112l5 5 9-10" stroke-dasharray="22" stroke-dashoffset="22"><animate attributeName="stroke-dashoffset" values="22;22;0;0;22" keyTimes="0;0.2;0.4;0.9;1" dur="5s" repeatCount="indefinite"/></path>
        <path d="M486 128l5 5 9-10" stroke-dasharray="22" stroke-dashoffset="22"><animate attributeName="stroke-dashoffset" values="22;22;0;0;22" keyTimes="0;0.4;0.6;0.9;1" dur="5s" repeatCount="indefinite"/></path>
      </g>
      <text x="522" y="104" class="m" font-size="9" fill="#4ade80">unit</text>
      <text x="522" y="120" class="m" font-size="9" fill="#4ade80">int</text>
      <text x="522" y="136" class="m" font-size="9" fill="#4ade80">e2e</text>
      <text x="510" y="162" class="m" font-size="10" fill="#4ade80" text-anchor="middle">TESTS PASS</text>
    </g>

    <!-- 4. DOCKER (stacked layers rising) -->
    <g>
      <rect x="690" y="78" width="80" height="64" rx="10" class="stg" stroke="#60a5fa"/>
      <g fill="#60a5fa">
        <rect x="712" y="126" width="12" height="8" rx="1.5"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.25;1" dur="5s" repeatCount="indefinite"/></rect>
        <rect x="726" y="126" width="12" height="8" rx="1.5"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.4;1" dur="5s" repeatCount="indefinite"/></rect>
        <rect x="740" y="126" width="12" height="8" rx="1.5"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.5;1" dur="5s" repeatCount="indefinite"/></rect>
        <rect x="719" y="114" width="12" height="8" rx="1.5" opacity=".8"><animate attributeName="opacity" values="0;0;.85;.85" keyTimes="0;0.5;0.62;1" dur="5s" repeatCount="indefinite"/></rect>
        <rect x="733" y="114" width="12" height="8" rx="1.5" opacity=".8"><animate attributeName="opacity" values="0;0;.85;.85" keyTimes="0;0.6;0.72;1" dur="5s" repeatCount="indefinite"/></rect>
        <rect x="726" y="102" width="12" height="8" rx="1.5" opacity=".6"><animate attributeName="opacity" values="0;0;.6;.6" keyTimes="0;0.72;0.85;1" dur="5s" repeatCount="indefinite"/></rect>
      </g>
      <path d="M706 96q14-10 28 0" stroke="#60a5fa" stroke-width="1.4" fill="none"/>
      <text x="730" y="162" class="m" font-size="10" fill="#60a5fa" text-anchor="middle">MULTI-STAGE</text>
    </g>

    <!-- 5. K8S + MONITORING -->
    <g transform="translate(920,110)">
      <circle r="30" fill="none" stroke="#1e4d6b"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
        <g fill="#a78bfa">
          <circle cx="0" cy="-30" r="3.6"/><circle cx="28" cy="-10" r="3.6"/>
          <circle cx="18" cy="24" r="3.6"/><circle cx="-18" cy="24" r="3.6"/><circle cx="-28" cy="-10" r="3.6"/>
        </g>
      </g>
      <circle r="13" fill="#0b1220" stroke="#a78bfa" stroke-width="1.4"/>
      <circle r="13" fill="none" stroke="#c4b5fd" stroke-width="2.6" stroke-dasharray="20 62" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" values="82;0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text y="52" class="m" font-size="10" fill="#a78bfa" text-anchor="middle">DEPLOYED</text>
    </g>

    <!-- Grafana-style live sparkline strip -->
    <g transform="translate(30,182)">
      <text class="m" font-size="9" fill="#475569" y="10">grafana ▸</text>
      <path d="M70 10 L110 2 L150 14 L190 5 L230 16 L270 6 L310 12 L350 1 L390 15 L430 7 L470 13 L510 3 L550 15 L590 8 L630 12 L670 4 L710 14 L750 6 L790 11 L830 3 L870 13 L910 8 L950 12"
            fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-linejoin="round"
            stroke-dasharray="900" stroke-dashoffset="900">
        <animate attributeName="stroke-dashoffset" values="900;0" dur="6s" repeatCount="indefinite"/>
      </path>
      <circle r="3" fill="#fbbf24" filter="url(#pg)">
        <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear"
          path="M70 10 L110 2 L150 14 L190 5 L230 16 L270 6 L310 12 L350 1 L390 15 L430 7 L470 13 L510 3 L550 15 L590 8 L630 12 L670 4 L710 14 L750 6 L790 11 L830 3 L870 13 L910 8 L950 12"/>
      </circle>
    </g>
  </g>
</svg>
