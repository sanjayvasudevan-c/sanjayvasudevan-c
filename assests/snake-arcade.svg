<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Snake game eating the tech stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/><stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="g2" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1b3a52" fill-opacity="0.75"/>
    </pattern>
    <path id="run" d="M70 96 H930 V168 H70 V240 H930" fill="none"/>
    <clipPath id="cab-clip"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>

  <style>
    .m{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
    .bl{}
  </style>

  <g clip-path="url(#cab-clip)">
    <rect width="1000" height="300" fill="url(#cab)"/>
    <rect x="46" y="62" width="908" height="204" rx="10" fill="#050c14" stroke="#1e4d6b"/>
    <rect x="46" y="62" width="908" height="204" fill="url(#dots)" opacity="0.8"/>

    <!-- cabinet header -->
    <text x="60" y="40" class="m" font-size="15" fill="#4ade80" letter-spacing="3" filter="url(#g2)">SANJAY.EXE — STACK EATER</text>
    <text x="940" y="40" class="m" font-size="12" fill="#f472b6" text-anchor="end">INSERT COIN<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.55;0.56;1" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/></text>
    <text x="812" y="40" class="m" font-size="12" fill="#64748b" text-anchor="end">HI-SCORE 999</text>

    <!-- live score, ticks up as pellets are eaten -->
    <g class="m" font-size="13" fill="#fbbf24" text-anchor="middle">
      <text x="500" y="288">SCORE 000<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.086;0.088;0.99;1" dur="18s" repeatCount="indefinite"/></text>
      <text x="500" y="288">SCORE 100<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.086;0.088;0.231;0.233;1" dur="18s" repeatCount="indefinite"/></text>
      <text x="500" y="288">SCORE 200<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.231;0.233;0.426;0.428;1" dur="18s" repeatCount="indefinite"/></text>
      <text x="500" y="288">SCORE 300<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.426;0.428;0.586;0.588;1" dur="18s" repeatCount="indefinite"/></text>
      <text x="500" y="288">SCORE 400<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.586;0.588;0.811;0.813;1" dur="18s" repeatCount="indefinite"/></text>
      <text x="500" y="288">SCORE 500<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.811;0.813;0.956;0.958;1" dur="18s" repeatCount="indefinite"/></text>
      <text x="500" y="288">SCORE 600<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.956;0.958;1" dur="18s" repeatCount="indefinite"/></text>
    </g>

    <!-- pellets: each pops the moment the head arrives -->
    <g class="m" font-size="10" text-anchor="middle">
      <g fill="#fbbf24" stroke="#fbbf24">
        <circle cx="300" cy="96" r="7" fill-opacity=".2" stroke-width="1.6">
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.08;0.088;0.99;1" dur="18s" repeatCount="indefinite"/>
          <animate attributeName="r" values="7;8.5;7" dur="1.4s" repeatCount="indefinite"/>
        </circle>
        <text x="300" y="80" stroke="none"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.08;0.088;0.99;1" dur="18s" repeatCount="indefinite"/>DOCKER</text>
      </g>
      <g fill="#22d3ee" stroke="#22d3ee">
        <circle cx="700" cy="96" r="7" fill-opacity=".2" stroke-width="1.6">
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.225;0.233;0.99;1" dur="18s" repeatCount="indefinite"/>
          <animate attributeName="r" values="7;8.5;7" dur="1.4s" begin="-.4s" repeatCount="indefinite"/>
        </circle>
        <text x="700" y="80" stroke="none"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.225;0.233;0.99;1" dur="18s" repeatCount="indefinite"/>KUBERNETES</text>
      </g>
      <g fill="#a78bfa" stroke="#a78bfa">
        <circle cx="700" cy="168" r="7" fill-opacity=".2" stroke-width="1.6">
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.428;0.99;1" dur="18s" repeatCount="indefinite"/>
          <animate attributeName="r" values="7;8.5;7" dur="1.4s" begin="-.8s" repeatCount="indefinite"/>
        </circle>
        <text x="700" y="152" stroke="none"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.428;0.99;1" dur="18s" repeatCount="indefinite"/>TERRAFORM</text>
      </g>
      <g fill="#f97316" stroke="#f97316">
        <circle cx="260" cy="168" r="7" fill-opacity=".2" stroke-width="1.6">
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.58;0.588;0.99;1" dur="18s" repeatCount="indefinite"/>
          <animate attributeName="r" values="7;8.5;7" dur="1.4s" begin="-1.1s" repeatCount="indefinite"/>
        </circle>
        <text x="260" y="152" stroke="none"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.58;0.588;0.99;1" dur="18s" repeatCount="indefinite"/>AWS</text>
      </g>
      <g fill="#4ade80" stroke="#4ade80">
        <circle cx="420" cy="240" r="7" fill-opacity=".2" stroke-width="1.6">
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.805;0.813;0.99;1" dur="18s" repeatCount="indefinite"/>
          <animate attributeName="r" values="7;8.5;7" dur="1.4s" begin="-1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="420" y="224" stroke="none"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.805;0.813;0.99;1" dur="18s" repeatCount="indefinite"/>JENKINS</text>
      </g>
      <g fill="#f472b6" stroke="#f472b6">
        <circle cx="820" cy="240" r="7" fill-opacity=".2" stroke-width="1.6">
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.95;0.958;0.99;1" dur="18s" repeatCount="indefinite"/>
          <animate attributeName="r" values="7;8.5;7" dur="1.4s" begin="-1.9s" repeatCount="indefinite"/>
        </circle>
        <text x="820" y="224" stroke="none"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.95;0.958;0.99;1" dur="18s" repeatCount="indefinite"/>GRAFANA</text>
      </g>
    </g>

    <!-- faint route the snake follows -->
    <use href="#run" stroke="#14344a" stroke-width="14" stroke-linejoin="round" stroke-opacity="0.5"/>

    <!-- snake body: same path, phase-shifted segments -->
    <g>
      <g><rect x="-6" y="-6" width="12" height="12" rx="3" fill="url(#body)" opacity=".30"><animateMotion dur="18s" repeatCount="indefinite" begin="-1.30s" calcMode="linear"><mpath href="#run"/></animateMotion></rect></g>
      <g><rect x="-6.5" y="-6.5" width="13" height="13" rx="3" fill="url(#body)" opacity=".40"><animateMotion dur="18s" repeatCount="indefinite" begin="-1.15s" calcMode="linear"><mpath href="#run"/></animateMotion></rect></g>
      <g><rect x="-7" y="-7" width="14" height="14" rx="3" fill="url(#body)" opacity=".50"><animateMotion dur="18s" repeatCount="indefinite" begin="-1.00s" calcMode="linear"><mpath href="#run"/></animateMotion></rect></g>
      <g><rect x="-7.5" y="-7.5" width="15" height="15" rx="3" fill="url(#body)" opacity=".62"><animateMotion dur="18s" repeatCount="indefinite" begin="-0.85s" calcMode="linear"><mpath href="#run"/></animateMotion></rect></g>
      <g><rect x="-8" y="-8" width="16" height="16" rx="4" fill="url(#body)" opacity=".72"><animateMotion dur="18s" repeatCount="indefinite" begin="-0.70s" calcMode="linear"><mpath href="#run"/></animateMotion></rect></g>
      <g><rect x="-8.5" y="-8.5" width="17" height="17" rx="4" fill="url(#body)" opacity=".82"><animateMotion dur="18s" repeatCount="indefinite" begin="-0.55s" calcMode="linear"><mpath href="#run"/></animateMotion></rect></g>
      <g><rect x="-9" y="-9" width="18" height="18" rx="4" fill="url(#body)" opacity=".90"><animateMotion dur="18s" repeatCount="indefinite" begin="-0.40s" calcMode="linear"><mpath href="#run"/></animateMotion></rect></g>
      <g><rect x="-9.5" y="-9.5" width="19" height="19" rx="4" fill="url(#body)" opacity=".96"><animateMotion dur="18s" repeatCount="indefinite" begin="-0.22s" calcMode="linear"><mpath href="#run"/></animateMotion></rect></g>
      <!-- head -->
      <g filter="url(#g2)">
        <rect x="-11" y="-11" width="22" height="22" rx="6" fill="#86efac" stroke="#ecfeff" stroke-width="1.4">
          <animateMotion dur="18s" repeatCount="indefinite" calcMode="linear"><mpath href="#run"/></animateMotion>
        </rect>
      </g>
    </g>

    <!-- CRT curvature + flicker -->
    <rect x="46" y="62" width="908" height="204" rx="10" fill="none" stroke="#0ea5e9" stroke-opacity=".25" stroke-width="3"/>
    <rect width="1000" height="300" fill="#22d3ee" opacity="0.015">
      <animate attributeName="opacity" values="0.01;0.035;0.01" dur="0.35s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
