<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="V Sanjay - Cloud and DevOps" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a12"/>
      <stop offset="55%" stop-color="#0a1424"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blobA">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1e3a5f" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1000" height="300" rx="18"/></clipPath>
    <clipPath id="t1"><rect x="54" y="176" width="0" height="20"><animate attributeName="width" values="0;186;186;186" keyTimes="0;0.16;0.94;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t2"><rect x="54" y="206" width="0" height="20"><animate attributeName="width" values="0;0;330;330;330" keyTimes="0;0.22;0.44;0.94;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t3"><rect x="54" y="236" width="0" height="20"><animate attributeName="width" values="0;0;360;360;360" keyTimes="0;0.5;0.72;0.94;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <style>
    .mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
    .name{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-weight:700;letter-spacing:5px}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)" opacity="0.5"/>

    <circle r="190" fill="url(#blobA)">
      <animate attributeName="cx" values="120;420;120" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;250;60" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle r="165" fill="url(#blobB)">
      <animate attributeName="cx" values="880;640;880" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="240;40;240" dur="15s" repeatCount="indefinite"/>
    </circle>

    <g fill="#67e8f9">
      <circle r="1.6" cx="180" cy="300" opacity=".7"><animate attributeName="cy" values="310;-10" dur="9s" repeatCount="indefinite"/></circle>
      <circle r="1.2" cx="330" cy="300" opacity=".6"><animate attributeName="cy" values="310;-10" dur="12s" begin="-3s" repeatCount="indefinite"/></circle>
      <circle r="2"   cx="520" cy="300" opacity=".5"><animate attributeName="cy" values="310;-10" dur="14s" begin="-7s" repeatCount="indefinite"/></circle>
      <circle r="1.4" cx="705" cy="300" opacity=".7"><animate attributeName="cy" values="310;-10" dur="10s" begin="-5s" repeatCount="indefinite"/></circle>
      <circle r="1.1" cx="905" cy="300" opacity=".6"><animate attributeName="cy" values="310;-10" dur="13s" begin="-9s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="30" y="26" width="940" height="248" rx="14" fill="#070d17" fill-opacity="0.82" stroke="#1e4d6b" stroke-width="1.2"/>
    <rect x="30" y="26" width="940" height="248" rx="14" fill="none" stroke="#22d3ee" stroke-width="1.6"
          stroke-dasharray="120 2256" stroke-linecap="round" opacity="0.9">
      <animate attributeName="stroke-dashoffset" values="2376;0" dur="6s" repeatCount="indefinite"/>
    </rect>
    <line x1="30" y1="60" x2="970" y2="60" stroke="#17364d" stroke-width="1"/>
    <circle cx="52" cy="43" r="4.6" fill="#ef4444"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="43" r="4.6" fill="#f59e0b"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="-0.5s" repeatCount="indefinite"/></circle>
    <circle cx="88" cy="43" r="4.6" fill="#22c55e"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="-1s" repeatCount="indefinite"/></circle>
    <text x="500" y="47" class="mono" font-size="11" fill="#3f6d8c" text-anchor="middle">root@sanjay:~/infra — zsh</text>

    <text x="54" y="126" class="name" font-size="52" fill="url(#nameGrad)" filter="url(#glow)">
      <tspan>V<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.001;0.2;1" dur="1.6s" fill="freeze"/></tspan>
      <tspan> <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.06;0.26;1" dur="1.6s" fill="freeze"/></tspan>
      <tspan>S<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.32;1" dur="1.6s" fill="freeze"/></tspan>
      <tspan>A<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.38;1" dur="1.6s" fill="freeze"/></tspan>
      <tspan>N<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.24;0.44;1" dur="1.6s" fill="freeze"/></tspan>
      <tspan>J<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.30;0.50;1" dur="1.6s" fill="freeze"/></tspan>
      <tspan>A<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.36;0.56;1" dur="1.6s" fill="freeze"/></tspan>
      <tspan>Y<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.62;1" dur="1.6s" fill="freeze"/></tspan>
    </text>
    <text x="56" y="150" class="mono" font-size="12.5" fill="#5eead4" letter-spacing="3.4">CLOUD · DEVOPS · DISTRIBUTED SYSTEMS</text>

    <g clip-path="url(#t1)"><text x="54" y="191" class="mono" font-size="13.5" fill="#94a3b8">$ whoami</text></g>
    <g clip-path="url(#t2)"><text x="54" y="221" class="mono" font-size="13.5" fill="#22d3ee">&gt; cse core @ chennai institute of technology</text></g>
    <g clip-path="url(#t3)"><text x="54" y="251" class="mono" font-size="13.5" fill="#a78bfa">&gt; i containerize things and keep them alive</text></g>
    <rect width="8" height="15" fill="#22d3ee">
      <animate attributeName="x" values="54;240;54;384;54;414;414" keyTimes="0;0.16;0.22;0.44;0.5;0.72;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="y" values="178;178;208;208;238;238" keyTimes="0;0.2;0.22;0.48;0.5;1" dur="11s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(838,168)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="6s" repeatCount="indefinite" additive="sum"/>
      <circle r="62" fill="none" stroke="#164e63" stroke-width="1"/>
      <circle r="44" fill="none" stroke="#155e75" stroke-width="1" stroke-dasharray="4 6"/>
      <circle r="20" fill="#06202e" stroke="#22d3ee" stroke-width="1.4"/>
      <circle r="20" fill="none" stroke="#67e8f9" stroke-width="3" stroke-dasharray="28 98" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" values="126;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
        <circle cx="62" cy="0" r="4.5" fill="#22d3ee"/><circle cx="-62" cy="0" r="4.5" fill="#22d3ee"/>
        <circle cx="0" cy="62" r="4.5" fill="#a78bfa"/><circle cx="0" cy="-62" r="4.5" fill="#a78bfa"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
        <rect x="-6" y="-50" width="12" height="12" rx="2" fill="none" stroke="#4ade80" stroke-width="1.4"/>
        <rect x="-6" y="38" width="12" height="12" rx="2" fill="none" stroke="#4ade80" stroke-width="1.4"/>
        <rect x="38" y="-6" width="12" height="12" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.4"/>
        <rect x="-50" y="-6" width="12" height="12" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.4"/>
      </g>
      <text y="4" class="mono" font-size="9" fill="#67e8f9" text-anchor="middle" letter-spacing="1">K8S</text>
    </g>

    <g class="mono" font-size="10.5">
      <circle cx="620" cy="88" r="3.5" fill="#4ade80"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="632" y="92" fill="#4ade80">pods 12/12 ready</text>
      <circle cx="620" cy="108" r="3.5" fill="#fbbf24"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" begin="-.5s" repeatCount="indefinite"/></circle>
      <text x="632" y="112" fill="#fbbf24">pipeline: building</text>
      <circle cx="620" cy="128" r="3.5" fill="#22d3ee"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" begin="-1s" repeatCount="indefinite"/></circle>
      <text x="632" y="132" fill="#22d3ee">uptime 99.9%</text>
    </g>

    <rect x="30" y="0" width="940" height="70" fill="url(#scan)">
      <animate attributeName="y" values="-70;300" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
